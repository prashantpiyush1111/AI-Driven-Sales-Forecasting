name: ML CI

on:
  push:
    branches: [ main ]
    paths:
      - 'ml-pipeline/**'
      - 'ml-service/**'
      - 'feature-store/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'ml-pipeline/**'
      - 'ml-service/**'
      - 'feature-store/**'

jobs:
  ml-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: python -m compileall -q ml-pipeline ml-service
