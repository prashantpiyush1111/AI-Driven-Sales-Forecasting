# Production: DB_USERNAME, DB_PASSWORD and JWT_SECRET are REQUIRED (no fallbacks).
# The app fails fast at startup if they are missing or if JWT_SECRET is < 32 chars.
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.com.salesforecast=INFO

# Do not leak internals in error responses or expose API docs publicly.
server.error.include-message=never
server.error.include-stacktrace=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
