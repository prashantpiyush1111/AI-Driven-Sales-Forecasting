spring.application.name=sales-forecast-backend
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Profiles: "dev" is the default. Production MUST run with SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# --- Database (no insecure defaults here; dev profile supplies local ones) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sales_forecast_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Security ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Login brute-force protection
security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# --- ML service ---
ml.service.base-url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.timeout-ms=${ML_SERVICE_TIMEOUT_MS:5000}

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Actuator / metrics ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

# --- Initial administrator (see AdminBootstrap) ---
bootstrap.admin.username=${ADMIN_USERNAME:admin}
bootstrap.admin.email=${ADMIN_EMAIL:admin@salesforecast.com}
bootstrap.admin.password=${ADMIN_PASSWORD:}
